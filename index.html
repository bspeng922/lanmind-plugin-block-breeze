<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f8f2">
  <meta name="description" content="方块小憩 Block Breeze：没有倒计时的离线方块消除小游戏。为 LanMind 而作。">
  <title>方块小憩 · Block Breeze</title>
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="src/app.js"></script>
</head>
<body>
  <div class="app is-loading" id="app">
    <header class="header">
      <a class="brand" href="./" aria-label="Block Breeze">
        <img src="icon.svg" width="40" height="40" alt="">
        <div><span class="brand-name">Block Breeze<span class="brand-dot">.</span></span><span class="brand-tagline" data-i18n="tagline"></span></div>
      </a>
      <div class="header-actions">
        <span class="offline"><span class="status-dot"></span><span data-i18n="offline"></span></span>
        <button class="icon-button" id="help-button" data-label="help"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 0 1 5 .5c0 1.8-2.5 1.8-2.5 3.5M12 16.5h.01"/></svg></button>
        <button class="icon-button" id="sound-button" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m11 5-6 4H2v6h3l6 4z"/><path class="sound-waves" d="M15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/><path class="sound-mute" d="m16 9 5 6m0-6-5 6"/></svg></button>
        <button class="icon-button" id="theme-button"><svg class="moon-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 13A9 9 0 0 1 11 3.2 9 9 0 1 0 20.8 13Z"/></svg><svg class="sun-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg></button>
      </div>
    </header>

    <main class="layout">
      <aside class="intro">
        <p class="eyebrow"><span></span><span data-i18n="eyebrow"></span></p>
        <h1 id="hero"></h1>
        <p class="intro-copy" id="intro-copy"></p>
        <p class="no-timer"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 14c4-8 12 8 16-4M4 10c4 8 12-8 16 4"/></svg><span data-i18n="untimed"></span></p>
        <div class="little-scene" aria-hidden="true"><div class="scene-grid"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><span class="scene-star star-one">✳</span><span class="scene-star star-two">+</span><span class="scene-dot"></span></div>
        <section class="milestone">
          <div class="milestone-top"><span data-i18n="goal"></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.3l-5.6 2.9 1.1-6.2L3 9.6l6.2-.9Z"/></svg></div>
          <div class="milestone-value" id="milestone-value"></div>
          <div class="milestone-track" role="progressbar" id="milestone-progress" aria-valuemin="0" aria-valuemax="100"><span id="milestone-fill"></span></div>
          <p data-i18n="goalHint"></p>
        </section>
      </aside>

      <section class="game" aria-label="Block Breeze">
        <div class="game-heading"><h2><span class="mode-icon">◫</span><span data-i18n="classic"></span></h2><span class="relaxed"><span class="status-dot"></span><span data-i18n="relaxed"></span></span></div>
        <div class="scores">
          <div class="score-box current-score"><span data-i18n="score"></span><strong id="score">0</strong></div>
          <div class="score-box"><span class="best-label"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 6 4 4 5-6 5 6 4-4-2 13H5Z"/></svg><span data-i18n="best"></span></span><strong id="best">0</strong></div>
          <div class="score-box"><span data-i18n="lines"></span><strong id="lines">0</strong></div>
        </div>

        <div class="board-shell" id="board-shell">
          <div class="board" id="board" role="grid" aria-label="8 × 8" aria-rowcount="8" aria-colcount="8"></div>
          <div class="board-feedback" id="board-feedback" aria-hidden="true"></div>
          <div class="game-over" id="game-over" hidden>
            <div class="game-over-card"><span class="over-leaf" aria-hidden="true">✳</span><h3 data-i18n="noRoom"></h3><p data-i18n="noRoomHint"></p><span class="over-score-label" data-i18n="finalScore"></span><strong id="final-score">0</strong><span class="new-best" id="new-best" data-i18n="newBest" hidden></span><button class="primary-button" id="play-again" data-i18n="playAgain"></button><button class="text-button" id="over-undo" data-i18n="undo"></button></div>
          </div>
        </div>

        <div class="tray-heading"><span data-i18n="tray"></span><span id="combo-badge" class="combo-badge" hidden></span><span class="tray-subtitle" data-i18n="trayHint"></span></div>
        <div class="tray" id="tray"></div>
        <div class="game-actions"><button class="action-button" id="undo-button" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5 3 11l6 6M3 11h10a6 6 0 0 1 6 8"/></svg><span data-i18n="undo"></span></button><span class="action-divider"></span><button class="action-button" id="restart-button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10a9 9 0 1 1 1.5 7M3 4v6h6"/></svg><span data-i18n="restart"></span></button></div>
        <p class="interaction-hint"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 12 3-8a1.5 1.5 0 0 1 3 1l-1 6 2-3a1.5 1.5 0 0 1 2 0l3 3-3 9H9l-5-7a1.5 1.5 0 0 1 2-2Z"/></svg><span data-i18n="hint"></span></p>
        <p class="save-status" id="save-status"><span class="save-dot"></span><span id="save-label" data-i18n="saveOk"></span></p>
      </section>
    </main>

    <footer class="footer"><span data-i18n="footer"></span><span><span class="footer-square"></span><span data-i18n="made"></span><span class="version">v1.0.0</span></span></footer>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <div class="drag-ghost" id="drag-ghost" aria-hidden="true" hidden></div>
  </div>

  <dialog id="help-dialog" class="dialog help-dialog" aria-labelledby="help-title">
    <button class="dialog-close icon-button" id="close-help" data-label="close">×</button>
    <div class="dialog-emblem" aria-hidden="true">◫</div><h2 id="help-title" data-i18n="helpTitle"></h2><p class="dialog-intro" data-i18n="helpIntro"></p>
    <ol class="rules"><li><div><h3 data-i18n="rule1Title"></h3><p data-i18n="rule1"></p></div></li><li><div><h3 data-i18n="rule2Title"></h3><p data-i18n="rule2"></p></div></li><li><div><h3 data-i18n="rule3Title"></h3><p data-i18n="rule3"></p></div></li></ol>
    <p class="scoring" data-i18n="scoring"></p><div class="keyboard-hint"><strong data-i18n="keys"></strong><p data-i18n="keysHint"></p></div><button class="primary-button" id="got-it" data-i18n="gotIt"></button>
  </dialog>
  <dialog id="restart-dialog" class="dialog restart-dialog" aria-labelledby="restart-title"><div class="dialog-emblem" aria-hidden="true">↻</div><h2 id="restart-title" data-i18n="restartTitle"></h2><p class="dialog-intro" data-i18n="restartHint"></p><div class="dialog-actions"><button class="secondary-button" id="cancel-restart" data-i18n="keepPlaying"></button><button class="primary-button" id="confirm-restart" data-i18n="confirmRestart"></button></div></dialog>
</body>
</html>
