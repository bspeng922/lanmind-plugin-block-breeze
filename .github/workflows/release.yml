name: Publish plugin
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check release version
        run: node --input-type=module -e 'import fs from "node:fs"; const p = JSON.parse(fs.readFileSync("package.json")); if (process.env.GITHUB_REF_NAME !== `v${p.version}`) throw new Error("Tag must match package.json and manifest.json");'
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Package plugin (signing is optional)
        env:
          BLOCK_BREEZE_SIGNING_KEY: ${{ secrets.BLOCK_BREEZE_SIGNING_KEY }}
        shell: bash
        run: |
          if [ -z "$BLOCK_BREEZE_SIGNING_KEY" ]; then
            npm run package:unsigned
          else
            umask 077
            printf '%s\n' "$BLOCK_BREEZE_SIGNING_KEY" > "$RUNNER_TEMP/block-breeze-publisher.pem"
            npm run package -- --key "$RUNNER_TEMP/block-breeze-publisher.pem"
          fi
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --verify-tag --title "Block Breeze $GITHUB_REF_NAME" --notes-file .github/RELEASE_NOTES.md
      - name: Remove temporary signing key
        if: always()
        shell: bash
        run: rm -f -- "$RUNNER_TEMP/block-breeze-publisher.pem"
